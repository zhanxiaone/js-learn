<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <button>点击禁用2秒</button>

    <script>
        //动态指定普通函数中this的指向
        // call()
            //语法：fun.call(thisArg,Arg1,Arg2,...)
            const obj={
                uname:'zmj'
            }
            function fn(x,y){
                console.log(this);//window
                console.log(x+y);   
            }
            //作用：调用函数
            //改变this指向
            fn.call(obj,1,2)


        // apply()
            //语法：fun.apply(thisArg,[argsArray])
            const obj2={
                age:18
            }
            function fn2(x,y){
                console.log(this);
                console.log(x+y);
                
            } 
            //作用：调用函数
            //改变this指向
            fn2.apply(obj,[1,2])//参数传的必须是数组
            //使用场景：求数组最大值
            const arr=[34,45,90];
            const max=Math.max.apply(Math,arr);
            const min=Math.min.apply(Math,arr);
            console.log(max,min);
            

        // *****bind()
            //bind()不会调用函数，但是能改变函数的内部this指向
            //语法：fun.bind(thisArg,Arg1,Arg2,...)
            //返回由指定的this值和初始参数返回的新函数


             const obj3={
                name:'zmj'
            }
            function fn(){
                console.log(this);
                
            }
            const fun=fn.bind(obj3) 
            console.log(fun) //返回一个新函数  但是这个函数的this是更改后的obj3  fn(){console.log(this);
            fun() //调用新函数，输出obj3
           

            //需求：有一个按钮，点击就禁用，2秒钟再开启
            const btn=document.querySelector('button');
            btn.addEventListener('click',function(){
                this.disabled=true;
                setTimeout(function(){
                    this.disabled=false;
                }.bind(this),2000)
            })

    //箭头函数没有this，箭头函数中的this是继承外层函数的this

                this.disabled=true;
                setTimeout(()=>{
                    this.disabled=false;
                    console.log(this); //btn
                    
                },2000)
            })

 */


        
    </script>
</body>
</html>
