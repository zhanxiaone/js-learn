<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    // Ⅰ-什么是数据?
        //         存储在内存中代表特定信息的'东西', 本质上是0101...(二进制数据)
        //         数据的特点: 可传递, 可运算 -->let a=0;b=a 🔜体现可传递
        //         一切皆数据
        //         内存中所有操作的目标: 数据
                        // 算术运算
                        // 逻辑运算
                        // 赋值
                        // 运行函数

    // Ⅱ-什么是内存?
        //         内存条通电后产生的可储存数据的空间(临时的)
        //         内存产生和死亡: 内存条(电路板)==>通电==>产生内存空间==>存储数据==>处理数据==>断电==>内存空间和数据都消失
    
                        //  内存分类
                        //     栈: 全局变量/局部变量
                        //     堆: 对象
                        // 堆里面一块小内存的组成：
                        //     内部存储的数据（内容）
                        //     地址值





    //  Ⅲ-什么是变量?
        //           可变化的量, 由变量名和变量值组成
        //           每个变量都对应的一块小内存, 变量名用来查找对应的内存, 变量值就是内存中保存的数据
        // ps:变量obj.xx-->.相当于拿着地址值找到堆中对应的内存,所以只有当我变量中存的是地址值,才可以用.  只有对象需要读地址值 
            var obj={name:'zmj'};  //obj保存的是对象在堆开辟的内存空间的地址值
            var a1=obj;  //将obj保存的内容（地址值）拷贝到a1保存
            console.log(obj.name); //zmj
            

        //  Ⅳ-内存,数据, 变量三者之间的关系
        //         内存用来存储数据的空间
        //         变量是内存的标识


    // Ⅴ-相关问题引出
                // ① 关于赋值和内存的问题
                            // let a = xxx, a内存中到底保存的是什么?

                            // xxx是基本数据, 保存的就是这个数据
                            // xxx是对象, 保存的是对象的地址值
                            // xxx是一个变量, 保存的xxx的内存内容(可能是基本数据, 也可能是地址值)

                // ② 关于引用变量赋值问题
                            // 2个引用变量指向同一个对象, 通过一个变量修改对象内部数据, 另一个变量看到的是修改之后的数据
                            // 2个引用变量指向同一个对象, 让其中一个引用变量指向另一个对象, 另一引用变量依然指向前一个对象

                                let a = {age: 12}

                                    let b = a//此时是将a指向的地址值赋值给B,所以B此时也指向{age:12}这个内存

                                    a = {name: 'zmj',age:15}//此时重新创建了一个内存并让a指向它,所以此处a指向的是{name:'hong'},而b指向仍是刚开始的指向{age:12}

                                    b.age = 14//此时a与b指向的内存已经不一样了,所以修改互不影响
                                    console.log(b.age, a.name, a.age) // 14 zmj 15

                                    function fn(obj){
                                        obj={age:16}
                                    };
                                    fn(a);
                                    console.log(a.age); //15
                                    /*当调用fn时，实参a传递给形参obj =>（obj=a） 
                                    此时他俩都等于a原来的内容【因为a是对象所以该内容就是地址值】：{name: 'zmj',age:15}
                                    再看函数体 将obj的内容重新定义
                                    那么obj就会重新在堆里开辟内存 指向现在的地址 a不变还是指向原来的地址
                            */



                //③ 在js调用函数时传递变量参数时, 是值传递还是引用传递
                        // 理解1: 都是值(基本/地址值)传递

                        // 所以实际上传进function中的参数也是拿着其存着的地址值找内存

                                    //传进来的obj存储的是a中存的地址值,所以obj==a(因为他们地址值一致,指向一致)
                                    //2个引用变量指向同一个对象, 通过一个变量修改对象内部数据, 另一个变量看到的是修改之后的数据  -->所以被进行了修改
                                    let m = {name: 'zmj'}
                                    const fn2=(obj) => obj.age= 15
                                    fn2(m)
                                    console.log(m.age) //15
                        // 理解2: 可能是值传递, 也可能是引用传递(地址值)  



                //④ JS引擎如何管理内存?
                            // 内存生命周期
                                // 分配小内存空间, 得到它的使用权
                                // 存储数据, 可以反复进行操作
                                // 释放小内存空间
                            // 释放内存
                                // 局部变量: 函数执行完自动释放
                                // 对象: 成为垃圾对象后==>垃圾回收器回收              

                            var n = 3;
                    var obj = {name:"hong"}
                    obj = undefined ||null  //此时,obj没有被释放,但是之前声明的`{name:"hong"}`由于没有人指向它,会在后面你某个时刻被垃圾回收器回收

                    function fn () { var b = {}}
                    fn() // b是自动释放, b所指向的对象是在后面的某个时刻由垃圾回收器回收






    </script>
</body>
</html>
