<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //1.动态参数
            //arguments是函数内部内置的伪！数组（有索引下标 但是没有常用的方法却有自己独特的方法）变量，它包含了调用函数时传入的所有实参


            function getSum(){
                let sum=0
                for(let i=0;i<arguments.length;i++){
                    sum+=arguments[i]
                }
                console.log(sum);
                
            }
            getSum(1,3,5,9,6,8,7);
        //2.*****剩余参数
            //允许我们将一个不定数量的参数表示为一个数组
            //...是语法符号，置于最末函数形参之前，用于获取多余的实参 是真！数组    
            

            function fn(a,b,...other){
                console.log(a);//1
                console.log(b);//6
                console.log(other);//[4,9,8]
                
            }
            fn(1,6,4,9,8);
   
            
        //3.展开运算符 可以展开数组（真数组）
            //典型运用场景：求数组max/min，合并数组等

            //求数组max/min
            const arr=[1,5,6,9,4];
            console.log(...arr);//1 5 6 9 4
            //...arr === 1,5,6,9,4
            console.log(Math.max(1,2,3));//max方法里面传递的只能是数值 不能是数组
            console.log(Math.max(...arr));//9
            
            //合并数组
            const arr2=[2,5,7];
            const arr3=[...arr,...arr2];
            console.log(arr3);
            
            



   </script>
</body>
</html>
