<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <P class="p">123</P>
    <script>
        //throw 抛异常 程序会停止执行 后面跟的是一个Error对象
                function fn(x,y){
                    if(!x || !y){
                        throw new Error('参数错误')
                    }
                    return x+y
                }
                console.log(fn());


        //try...catch 捕获错误信息
                
                function fn(){
                    try {
                        //可能发生错误的代码 要写到try
                        const p=document.querySelector('p');
                        p.style.color='red';
                    } catch (error) {
                        //拦截错误 提升浏览器提供的错误信息 但是不中断程序的执行
                        console.log(error.message);
                        throw new Error('这是一个新的错误')  //throw抛出错误更明显
                        //return   //需要加上return 中断程序的执行
                    }
                    console.log(11);
                    
                }
                fn();



        //finally 无论try中是否发生错误，finally中的代码都会执行
                function fn(){
                    try {
                        const p=document.querySelector('p');
                        p.style.color='red';
                    } catch (error) {
                        console.log(error.message);
                    } finally {
                        console.log('无论如何都会执行');
                    }
                }
                fn();      
                
                

        //debugger 断点调试
                function fn(){
                    const p=document.querySelector('p');
                    p.style.color='red';
                    debugger;  //在这里设置断点 在浏览器的开发者工具中，代码执行到debugger时会暂停，可以查看当前的变量值和调用栈等信息
                   //打开控制台会直接执行到debugger处暂停，查看当前的变量值和调用栈等信息
                    console.log(11);
                }
                fn();       
        
    </script>
</body>
</html>
