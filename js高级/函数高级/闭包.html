<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //闭包=内层函数+外层函数的变量
        //闭包作用：封闭数据，提供操作，外部也可以访问函数内部的变量

        //简单写法
                function outer(){
                    const a=1;
                    function f(){
                        console.log(a);
                        
                    }
                    f()
                }
                outer()

        //常见的闭包形式 外部可以访问使用 函数内部的变量
                function outer(){
                    const a=1;
                    function fn(){
                        console.log(a);
                        
                    }
                    return fn
                }
                //outer() ===fn===function fn(){}
                const fun=outer() //fun===function fn(){}
                fun()//调用函数 输出a
    </script>
</body>
</html>
