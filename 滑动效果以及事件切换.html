<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title></title>
		<style>
			div {
				width: 150px;
				height: 300px;
				background-color: aquamarine;
				display: none;
			}
		</style>
		<script src="jQuery.js"></script>
	</head>
	<body>
		<button>下拉滑动</button>
		<button>上拉滑动</button>
		<button>切换滑动</button>
		<div></div>
		<script>
			/* 语法规范:slideDown(-up -toggle)/hide/show/toggle([speed],[easing],[fn]); 中括号内参数都可以省略
			speed:速度可以是normal slow fast 数值(毫秒)
			easing:切换效果 默认是swing 可用参数linear
			fn:回调函数 */
			$(function(){
				$("button").eq(0).click(function(){
					//下滑动 slideDown()
					$("div").slideDown(1000,function(){
						alert(1);
					});
				})
				$("button").eq(1).click(function(){
					//上滑动 slideUp()
					$("div").slideUp();
				})
				$("button").eq(2).click(function(){
					//滑动切换 slideToggle()
					$("div").slideToggle(500);
				})
				
				
				
				
				
			})
			
			
			
			
			
		</script>
	</body>
</html>
