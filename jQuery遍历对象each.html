<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title></title>
		<script src="jQuery.js"></script>
	</head>
	<body>
		<div>1</div>
		<div>2</div>
		<div>3</div>
		
		<script>
			//如果是针对同一元素做不同操作，需要用到each方法遍历元素 类似for但比for强大
			
			var arr=["red","green","blue"];
			
			
			
			$(function(){
				$("div").each(function(index,domEle){
					//回调函数内第一个参数一定是索引号 可以自己指定名称
					console.log(index);
					//回调函数内第二个参数一定是dom元素对象 可以自己指定名称
					console.log(domEle);
					// domEle.css("color"); 错误 因为domEle是dom对象没有css方法
					$(domEle).css("color","blue");
				})
				
				
			
				
				
			})
		</script>
	</body>
</html>
