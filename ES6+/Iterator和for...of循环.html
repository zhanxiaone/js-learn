<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Iterator（遍历器）的概念
        //         JavaScript 原有的表示“集合”的数据结构，主要是数组（Array）和对象（Object），ES6 又添加了Map和Set。这样就有了四种数据集合，用户还可以组合使用它们，定义自己的数据结构，比如数组的成员是Map，Map的成员是对象。这样就需要一种统一的接口机制，来处理所有不同的数据结构。

        //         遍历器（Iterator）就是这样一种机制。它是一种接口，为各种不同的数据结构提供统一的访问机制。任何数据结构只要部署 Iterator 接口，就可以完成遍历操作（即依次处理该数据结构的所有成员）。

        //         Iterator 的作用有三个：一是为各种数据结构，提供一个统一的、简便的访问接口；二是使得数据结构的成员能够按某种次序排列；
        //          三是 ES6 创造了一种新的遍历命令for...of循环，Iterator 接口主要供for...of消费。
    
        // Iterator 是一种新的遍历机制 两个核心
        //遍历器一个接口，能快速访问数据 通过Symbol.iterator创建遍历器，再通过遍历器的next()获取遍历后的结果
        const items=['one','two','three'];
        const ite=items[Symbol.iterator]();
        console.log(ite.next());//{value: 'one', done: false}
        console.log(ite.next());//{value: 'two', done: false}
        console.log(ite.next());//{value: 'three', done: false}

    //value属性是当前成员的值，done属性是一个布尔值，表示遍历是否结束。
    
    
    
    

    
    
    
    
            //     for...of 与 for...in区别
            // for in遍历的是数组的索引（即键名），
            // 而for of遍历的是数组元素值（即键值）。
                const arr=['zmj','wzt','fty'];
                for(let x in arr){
                    console.log(x);
                                    
                }

                for(let i of arr){
                    console.log(i);
                    
                };
                
                arr.forEach((element,index) => {
                   console.log(element);
                    console.log(index);
                    
                });
    //一般用for in遍历对象而不用来遍历数组
    //for of 适合用来遍历数组
    
    
    
    
    
    </script>
</body>
</html>
