<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
          //arguments是函数内部内置的伪！数组（有索引下标 但是没有常用的方法却有自己独特的方法）变量，它包含了调用函数时传入的所有实参


            function getSum(){
                let sum=0
                for(let i=0;i<arguments.length;i++){
                    sum+=arguments[i]
                }
                console.log(sum);
                
            }
            getSum(1,3,5,9,6,8,7);
        //箭头函数不能使用arguments变量
        //所以ES6引入rest参数（形式为...变量名），用于获取函数的参数，用来代替arguments用于获取函数的多余参数
        //rest 参数搭配的变量是一个真数组，该变量将多余的参数放入数组中。
            function add(...values) {
                let sum = 0;
                for (var val of values) {
                    sum += val;
                }
                return sum;
            }

                add(2, 5, 3) // 10





        // arguments变量的写法
        function sortNumbers() {
        return Array.prototype.slice.call(arguments).sort();
        }

        // rest参数的写法
        const sortNumbers = (...numbers) => numbers.sort();
        //arguments对象不是数组，而是一个类似数组的对象。所以为了使用数组的方法，必须使用Array.prototype.slice.call先将其转为数组
        //rest 参数就不存在这个问题，它就是一个真正的数组，数组特有的方法都可以使用
    </script>
</body>
</html>
