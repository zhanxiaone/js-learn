<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    //   模板字符串（template string）是增强版的字符串, 用反引号[ ` ]标识。
    //   它可以当作普通字符串使用, 
    //   也可以用来定义多行字符串, 或者在字符串中嵌入变量。

        let str=`我是一个字符串`;
        console.log(str,typeof str);
        
        let string1='<ul><li>img</li></ul>'  //在es5创建元素是不允许换行的

        // 模板字符串中可以出现换行符
        //所有的空格和缩进都会被保留在输出之中。
        let string2=`<ul>
                      <li>img</li>
                      </ul>`

        //变量拼接  可以使用 ${xxx} 形式输出变量
        let uesrname='z';
        let out=`${uesrname}是用户名`;
        console.log(out);
        


// 大括号内部可以放入任意的 JavaScript 表达式
// 括号内部可以放入任意的 JavaScript 表达式, 可以进行运算, 以及引用对象属性。

        let x = 1;
        let y = 2;
        `${x} + ${y} = ${x + y}`// "1 + 2 = 3"
        `${x} + ${y * 2} = ${x + y * 2}`// "1 + 4 = 5"
        let obj = {x: 1, y: 2};
        `${obj.x + obj.y}`// "3"

// 模板字符串之中还能调用函数。
        function fn() {  return "Hello World";}
        `foo ${fn()} bar`// foo Hello World bar






        //es6允许在大括号里面，直接写入变量和函数，作为对象的属性名和方法
            let name='es6';
            let method=function(){
                console.log("hello，world");
            }

            const code={
                name,//name:name,
                method,//method:method,
                improve(){
                    console.log("提升");
                    
                } //improve:function(){}
            }


    </script>
</body>
</html>
