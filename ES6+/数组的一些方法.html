<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //forEach（）主要是遍历数组对象，用于调用数组的每个元素，并将元素传递给回调函数
                //语法格式
                const arr=['pink','green','blue'];
                arr.forEach(function(item,index){
                    console.log(item);//数组元素
                    console.log(index);//索引号
                                return item+'颜色';

                })
                //参数的数组元素是必须要写的 索引号可写可不写
                //forEach只遍历不返回 map有返回值







        //map()作用是迭代数组可以遍历数组处理数据，并且返回新的数组
                const array=['pink','green','blue'];
                const newArr=array.map(function(item,index){
                    console.log(item);//数组元素
                    console.log(index);//索引号
                    return item+'颜色';
                    
                });
                console.log(newArr);






        //fliter()用于过滤数组，返回新数组（满足筛选条件的数组元素）
                //filter()语法如下：
                // array.filter(function(value, index, arr), thisValue)
                let numbers = [1, 2, 3, 4, 5, 6, 7, 8];
                let result = numbers.filter(function(num,index,arr) {
                    console.log(num);
                    console.log(index);
                    console.log(arr);

                    return num >= 5;
                });
                console.log(result);   // 输出：[5, 6, 7, 8]



        //reduce()作用是累计器，返回累计处理的结果，经常用于求和等    
                //语法格式
                // arr.reduce(function(前一个值，当前值){}，初始值)
                    const arr2=[2,5,8];
                    const total=arr2.reduce((pre,cur)=>pre+=cur);
                    console.log(total);
                    

        
        //join()用于把数组中的所有元素转换成一个字符串
                //数组元素是通过参数里面指定的分隔符进行分隔的，默认是逗号，若为空字符串（''），则元素之间没有任何字符
                console.log(newArr.join());//pink颜色,green颜色,blue颜色
                console.log(newArr.join(''));
                console.log(newArr.join('|'));


        //find()查找元素，返回符合条件的第一个数组元素值，如果没有则返回underfined
                const arr3=[{name:'red'},{name:'blue'},{name:'green'}];
                const find=arr3.find(item=>item.name==='blue');
                console.log(find);
      

        //every()检测数组中所有元素是否都符合指定条件，所有元素都通过检测才返回true
                const arr5=[10,30,40];
                const flag=arr5.every(item=>item>10);
                console.log(flag);
                




        //some()检测数组中所有元素是否都符合指定条件，有元素通过检测就返回true
                const arr6=[10,80,90];
                const f=arr6.some(item=>item>10);
                console.log(f);
                
        // Array.from()用于将两类对象转为真正的数组：1.类似数组的对象（array-like object）
        // 2.可遍历（iterable）的对象（包括 ES6 新增的数据结构 Set 和 Map）。

                let arrayLike = {
                    '0': 'a',
                    '1': 'b',
                    '2': 'c',
                    length: 3
                };

                // ES6的写法
                let arr7 = Array.from(arrayLike); // ['a', 'b', 'c']
                arr7.pop();//真数组才能使用这些方法
                console.log(arr7);
                



    </script>
</body>
</html>
